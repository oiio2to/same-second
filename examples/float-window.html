<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#e8e4de">
<title>歌詞浮窗 · 同一秒 · 一起听完整指南</title>
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
@font-face{font-family:'YouYouYiSong';src:url('/fonts/youyouyisong.ttf') format('truetype');font-display:swap}
@font-face{font-family:'HuiwenTsukiji';src:url('/fonts/汇文筑地五号明朝体.otf') format('opentype');font-display:swap}
@font-face{font-family:'MysteryTypewriter';src:url('/fonts/MysteryTypewriter.ttf') format('truetype');font-display:swap}
:root{--px:'DotGothic16',monospace;--sc:'YouYouYiSong',serif;--tc:'HuiwenTsukiji','Songti TC','Kaiti TC',serif;--tw:'MysteryTypewriter',monospace;--en:'IM Fell English',Georgia,serif;
--ink:#4a3a2e;--mut:#a0907e;--bd:#8a8078;--sh:#d8ccb8;--rose:#b85c72}
body{margin:0 auto;max-width:430px;padding:calc(env(safe-area-inset-top) + 14px) 12px 60px;font-family:var(--sc);color:var(--ink);background:#e8e4de}
.pg{position:relative;min-height:130vw;box-sizing:border-box;margin-bottom:22px;
background:linear-gradient(170deg,#e2ecdf 0%,#efe2e3 62%,#f4dee2 100%);
border:2px solid var(--bd);box-shadow:4px 4px 0 var(--sh);padding:26px 22px 16px;display:flex;flex-direction:column}
.pg::before{content:"";position:absolute;inset:7px;border:1.5px dashed rgba(160,140,130,.38);pointer-events:none}

.pg>*{position:relative;z-index:1}
/* 封面 */
.cov{align-items:center;text-align:center;justify-content:center}
.cov .orn{margin-bottom:22px}
.cov .strap{display:flex;align-items:center;gap:10px;width:86%;margin-bottom:20px}
.cov .strap i{flex:1;height:0;border-top:1px solid rgba(184,92,114,.5)}
.cov .strap span{font-family:var(--px);font-size:10px;letter-spacing:3px;color:var(--rose);white-space:nowrap}
.cov .strap b{font-family:var(--tw);font-size:9px;letter-spacing:2px;color:#b08a94;font-weight:400;position:relative;top:2.5px;position:relative;top:2px}
.cov .edition{font-family:var(--sc);font-size:13px;color:#8a6a74;letter-spacing:6px;margin-bottom:12px}
.cov h2{font-family:var(--tc);font-size:34px;line-height:1.55;letter-spacing:4px;margin:0 0 16px;color:#5a3a44}
.cov h2 em{font-style:normal;background:linear-gradient(transparent 58%,rgba(184,92,114,.24) 58%);padding:0 3px}
.cov .dia{color:var(--rose);font-size:10px;margin-bottom:16px}
.cov .tagline{font-family:var(--sc);font-size:13.5px;color:#7a6a6e;letter-spacing:1px;margin-bottom:22px}
.cov .pre{display:flex;align-items:center;gap:10px;width:60%}
.cov .pre i{flex:1;height:0;border-top:1px solid rgba(184,92,114,.4)}
.cov .pre span{font-family:var(--px);font-size:9px;letter-spacing:5px;color:var(--rose)}
/* 章节页 */
.ph{display:flex;align-items:baseline;gap:7px;margin-bottom:2px}
.ph .no{font-family:var(--en);font-style:italic;font-size:18px;color:var(--rose)}
.ph .cn{font-family:var(--px);font-size:11px;letter-spacing:4px}
.ph .div{color:#c8b8ac}
.ph .small{font-family:var(--px);font-size:9px;color:var(--mut);letter-spacing:1px}
.ph .enr{margin-left:auto;font-family:var(--tw);font-size:9px;color:#b09a9e}
.bigt{font-family:var(--tc);font-size:22px;line-height:1.5;margin:12px 0 10px;letter-spacing:1px;color:#503a40}
.bigt em{font-style:normal;background:linear-gradient(transparent 55%,rgba(184,92,114,.22) 55%);padding:0 2px}
.bodyt{font-family:var(--sc);font-size:12.5px;line-height:2.05;margin:0 0 12px}
.bodyt b{color:var(--rose)}
.li{display:flex;gap:10px;align-items:flex-start;background:rgba(253,249,243,.85);border:1.5px solid rgba(160,140,110,.4);box-shadow:2px 2px 0 rgba(180,160,140,.3);padding:9px 11px;margin-bottom:9px}
.li .rn{font-family:var(--en);font-style:italic;font-size:12px;color:var(--rose);min-width:14px}
.li .lt{font-family:var(--sc);font-size:12px;line-height:1.85}
.li .lt b{color:var(--rose)}
.li .side{margin-left:auto;font-family:var(--px);font-size:7.5px;color:#b8a06a;flex-shrink:0;align-self:center}
.quote{border-left:3px solid;padding:10px 12px;margin:auto 0 8px}
.quote .qh{font-family:var(--px);font-size:9px;letter-spacing:2px;margin:0 0 6px}
.quote p{font-family:var(--sc);font-size:12px;line-height:1.95;margin:0}
.pfoot{display:flex;align-items:center;margin-top:auto;padding-top:9px;border-top:1px solid rgba(160,140,130,.4)}
.pfoot .bn{font-family:var(--en);font-style:italic;font-size:10px;color:#a08a86}
.pfoot .dots{margin-left:auto;margin-right:8px;letter-spacing:2px;font-size:6.5px;opacity:.85}
.pfoot .pn{font-family:var(--px);font-size:9px;color:var(--mut)}
.forow{display:flex;gap:9px;margin:20px 0 4px}
.fo{flex:1;position:relative}
.fo .tab{position:absolute;top:-13px;left:0;font-family:var(--px);font-size:6.5px;letter-spacing:1px;border:1.5px solid;border-bottom:none;border-radius:8px 8px 0 0;padding:4px 8px 6px}
.fo .body{border:1.5px solid;border-radius:0 12px 12px 12px;padding:13px 7px 10px;text-align:center;box-shadow:0 2px 8px rgba(140,120,100,.08)}
.fo .zh{font-family:var(--tc);font-size:13px;letter-spacing:1px;margin-top:6px}
.fo .df{font-family:var(--sc);font-size:9px;color:#96867c;line-height:1.7;margin-top:4px}
</style></head>
<body style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:20px">
<div style="width:340px"><div style="background:rgba(248,243,238,.97);border-radius:14px;padding:10px 24px;position:relative;border:1px solid rgba(160,140,130,.3);box-shadow:0 4px 14px rgba(120,90,90,.16)">
      <span style="position:absolute;top:7px;left:9px;color:rgba(82,64,60,.6);font-size:9px">⌄</span>
      <span style="position:absolute;top:6px;right:9px;color:rgba(82,64,60,.6);font-size:10px">✕</span>
      <div style="display:flex;align-items:center;gap:6px">
        <img src="https://is1-ssl.mzstatic.com/image/thumb/Music211/v4/fc/1d/9e/fc1d9e9d-5d56-b34d-56ef-53cb83979fd2/24UM1IM24742.rgb.jpg/300x300bb.jpg" style="width:22px;height:22px;border-radius:5px;object-fit:cover;flex-shrink:0" alt="">
        <span style="font-family:var(--sc);font-size:10px;font-weight:700;color:#43333a;overflow:hidden;white-space:nowrap;text-overflow:ellipsis">🎧 Soft Spot (Acoustic) · ke…</span>
        <span style="margin-left:auto;font-family:var(--px);font-size:8px;color:rgba(82,64,60,.6)">2:40 / 3:28</span>
      </div>
      <div style="text-align:center;font-family:var(--px);font-size:10px;color:#43333a;margin-top:7px">You know I got a soft spot for you</div>
      <div style="text-align:center;font-family:var(--sc);font-size:9px;color:rgba(122,92,104,.85);margin-top:2px">你深知 我心中柔软的一隅留给了你</div>
      <div style="text-align:center;font-family:var(--sc);font-size:9px;color:rgba(82,64,60,.55);margin-top:8px;border-top:1px solid rgba(160,140,130,.2);padding-top:6px">◈ 跟他說句話…</div>
    </div></div>
</body></html>
